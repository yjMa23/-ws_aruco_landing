px4_aruco_landing_node:
  ros__parameters:
    control_rate_hz: 20.0

    takeoff_alt: 3.0
    search_x: 1.0
    search_y: 1.0
    search_alt: 3.0
    abort_hover_alt: 3.0

    rendezvous_altitude_m: 5.0
    rendezvous_radius_m: 2.0
    gnss_fix_timeout_s: 1.0
    gnss_velocity_timeout_s: 1.0
    gnss_stable_duration_s: 1.0
    max_gnss_jump_m: 5.0
    max_rendezvous_speed_mps: 2.0
    max_target_step_m: 0.20
    search_offset_m: 1.0
    search_point_hold_s: 1.0
    aruco_acquire_duration_s: 0.5
    gnss_max_geodetic_range_m: 10000.0
    deck_gnss_velocity_frame_id: world_enu

    visual_handover_duration_s: 0.5
    handover_max_horizontal_difference_m: 3.0
    max_visual_measurement_jump_m: 0.5
    visual_loss_short_timeout_s: 0.5
    visual_loss_long_timeout_s: 2.0

    target_state_estimator.process_acceleration_std_mps2: 1.0
    target_state_estimator.measurement_horizontal_std_m: 0.08
    target_state_estimator.measurement_vertical_std_m: 0.12
    target_state_estimator.initial_position_std_m: 0.20
    target_state_estimator.initial_velocity_std_mps: 1.0
    target_state_estimator.minimum_sample_dt_s: 0.001
    target_state_estimator.maximum_sample_dt_s: 0.50
    target_state_estimator.reinitialize_gap_s: 2.0
    target_state_estimator.innovation_gate_mahalanobis: 5.0

    motion_predictor.additional_prediction_horizon_s: 0.10
    motion_predictor.max_prediction_horizon_s: 0.50
    estimator_output_timeout_s: 2.0
    estimated_deck_child_frame_id: estimated_deck

    tracking.mode: PREDICTED_POSITION_VELOCITY_FF
    tracking.max_position_target_speed_mps: 2.0
    tracking.max_position_target_step_m: 0.20
    tracking.velocity_feedforward_gain: 1.0
    tracking.relative_velocity_gain: 0.25
    tracking.max_velocity_feedforward_mps: 1.5
    tracking.max_velocity_feedforward_acceleration_mps2: 1.0
    tracking.max_prediction_age_s: 0.75

    expected_aruco_pose_frame_id: camera_link
    camera_extrinsic.translation_frd_m: [0.0, 0.0, -0.10]
    camera_extrinsic.rotation_wxyz: [0.70710678, 0.0, 0.0, 0.70710678]

    offboard_prestream_count: 20
    stable_detect_count: 10

    camera_x_to_body_y_sign: 1.0
    camera_y_to_body_x_sign: -1.0
    max_xy_step: 0.20
    center_xy_threshold: 0.15

    max_descent_rate: 0.20
    final_alt: 0.30
    marker_lost_timeout: 1.0
    aruco_pose_timeout: 0.5

    takeoff_z_threshold: 0.20
    search_xy_threshold: 0.25
    search_z_threshold: 0.20
    command_retry_interval: 1.0

    enable_auto_land: false
    target_pose_frame_id: local_ned
