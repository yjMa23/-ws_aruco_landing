px4_aruco_landing_node:
  ros__parameters:
    control_rate_hz: 20.0

    takeoff_alt: 3.0
    search_x: 1.0
    search_y: 1.0
    search_alt: 3.0
    abort_hover_alt: 3.0

    rendezvous_altitude_m: 5.0
    rendezvous_radius_m: 2.0
    gnss_fix_timeout_s: 1.0
    gnss_velocity_timeout_s: 1.0
    gnss_stable_duration_s: 1.0
    max_gnss_jump_m: 5.0
    max_rendezvous_speed_mps: 2.0
    max_target_step_m: 0.20
    search_offset_m: 1.0
    search_point_hold_s: 1.0
    aruco_acquire_duration_s: 0.5
    gnss_max_geodetic_range_m: 10000.0
    deck_gnss_velocity_frame_id: world_enu

    visual_handover_duration_s: 0.5
    handover_max_horizontal_difference_m: 3.0
    max_visual_measurement_jump_m: 0.5
    visual_loss_short_timeout_s: 0.5
    visual_loss_long_timeout_s: 2.0

    target_state_estimator.process_acceleration_std_mps2: 1.0
    target_state_estimator.measurement_horizontal_std_m: 0.08
    target_state_estimator.measurement_vertical_std_m: 0.12
    target_state_estimator.initial_position_std_m: 0.20
    target_state_estimator.initial_velocity_std_mps: 1.0
    target_state_estimator.minimum_sample_dt_s: 0.001
    target_state_estimator.maximum_sample_dt_s: 0.50
    target_state_estimator.reinitialize_gap_s: 2.0
    target_state_estimator.innovation_gate_mahalanobis: 5.0

    # vertical estimation 并行垂直估计器当前只发布调试结果，不接管 relative descent 控制。
    vertical_state_estimator.enabled: true
    vertical_state_estimator.process_acceleration_std_mps2: 0.40
    vertical_state_estimator.measurement_std_m: 0.05
    # 低高度误差随观测距离变化，暂不使用固定常量偏置。
    vertical_state_estimator.measurement_bias_m: 0.0
    vertical_state_estimator.initial_position_std_m: 0.10
    vertical_state_estimator.initial_velocity_std_mps: 0.50
    vertical_state_estimator.minimum_sample_dt_s: 0.001
    vertical_state_estimator.maximum_sample_dt_s: 0.25
    vertical_state_estimator.reinitialize_gap_s: 2.0
    vertical_state_estimator.innovation_gate_mahalanobis: 5.0
    vertical_state_estimator.prediction_horizon_s: 0.10

    # vertical estimation 对照结果：gain=1.0 同时改善静止与升沉相对高度跟踪。
    vertical_velocity_feedforward.enabled: true
    vertical_velocity_feedforward.deck_velocity_gain: 1.0
    vertical_velocity_feedforward.max_abs_mps: 0.60

    # touchdown evidence 只并行发布触地候选/确认结果，不触发状态跳转或 Land/Disarm。
    touchdown_detector.enabled: true
    touchdown_detector.px4_status_timeout_s: 0.20
    touchdown_detector.visual_timeout_s: 0.20
    touchdown_detector.low_height_enter_m: 0.18
    touchdown_detector.low_height_exit_m: 0.28
    touchdown_detector.max_relative_vertical_speed_mps: 0.12
    # UAV 世界系垂直速度只保留为诊断 evidence；触地确认使用有效相对垂直速度。
    touchdown_detector.max_uav_vertical_speed_mps: 0.15
    # PX4 在移动甲板上可能报告世界系水平运动；相对甲板速度低于该值仍可形成候选。
    touchdown_detector.max_relative_horizontal_speed_mps: 0.15
    # Offboard 位置环将参考压到甲板内部后，若机体在近地持续停滞，则视为物理接触候选。
    touchdown_detector.terminal_contact_max_height_m: 0.24
    touchdown_detector.terminal_contact_min_reference_error_m: 0.10
    touchdown_detector.terminal_contact_max_geometry_gap_m: 0.03
    touchdown_detector.terminal_contact_max_vertical_speed_mps: 0.05
    touchdown_detector.candidate_required_duration_s: 0.50

    # heave touchdown 触地确认后锁存甲板相对高度；估计失效时保持最后安全世界系目标。
    touchdown_hold.max_target_rate_mps: 0.60
    # terminal contact stabilization 可选预压参考独立限速；未提供目标时旧路径完全不变。
    touchdown_hold.max_reference_preload_rate_mps: 0.05
    # 静止甲板估计噪声实测峰值约 0.030 m/s；H1 理论峰值约 0.0628 m/s。
    # 使用迟滞只在可辨识升沉时随动，避免静止甲板噪声导致离板。
    touchdown_hold.motion_enter_speed_mps: 0.04
    touchdown_hold.motion_exit_speed_mps: 0.02

    # final descent 默认关闭。0.50→0.25 m 快速接近，0.25 m 以下低速接触。
    final_descent.enabled: false
    final_descent.entry_height_m: 0.50
    final_descent.approach_rate_mps: 0.12
    final_descent.contact_rate_mps: 0.03
    final_descent.contact_slowdown_height_m: 0.25
    # 进入终端落板段后，只允许“相对高度过低”使 landing window 关闭；
    # 视觉、水平误差、相对速度或甲板姿态异常仍会暂停。
    final_descent.terminal_descent_entry_height_m: 0.20
    # 目标略低于机体真实接触高度，使起落架能够压到甲板并触发 PX4 land detector。
    final_descent.minimum_command_height_m: 0.05
    final_descent.max_reference_tracking_error_m: 0.20

    motion_predictor.additional_prediction_horizon_s: 0.10
    motion_predictor.max_prediction_horizon_s: 0.50
    estimator_output_timeout_s: 2.0
    estimated_deck_child_frame_id: estimated_deck

    tracking.mode: PREDICTED_POSITION_VELOCITY_FF
    tracking.max_position_target_speed_mps: 2.0
    tracking.max_position_target_step_m: 0.20
    tracking.velocity_feedforward_gain: 1.0
    tracking.relative_velocity_gain: 0.25
    tracking.adaptive_relative_velocity_gain.enabled: true
    tracking.adaptive_relative_velocity_gain.min_gain: 0.25
    tracking.adaptive_relative_velocity_gain.max_gain: 1.20
    tracking.adaptive_relative_velocity_gain.acceleration_low_threshold_mps2: 0.05
    tracking.adaptive_relative_velocity_gain.acceleration_high_threshold_mps2: 0.35
    tracking.adaptive_relative_velocity_gain.max_acceleration_mps2: 1.50
    tracking.adaptive_relative_velocity_gain.acceleration_filter_gain: 0.20
    tracking.max_velocity_feedforward_mps: 1.5
    tracking.max_velocity_feedforward_acceleration_mps2: 1.0
    tracking.max_prediction_age_s: 0.75

    # relative MPC 显式选择 tracking.mode=RELATIVE_MPC 后启用；默认仍使用 adaptive rule-based tracking。
    relative_mpc.sample_period_s: 0.05
    relative_mpc.horizon_steps: 20
    relative_mpc.state_weights: [8.0, 8.0, 2.0, 2.0]
    relative_mpc.terminal_state_weights: [16.0, 16.0, 4.0, 4.0]
    relative_mpc.control_weights: [0.20, 0.20]
    relative_mpc.control_increment_weights: [1.0, 1.0]
    relative_mpc.speed_slack_weight: 1000.0
    relative_mpc.maximum_uav_speed_mps: 2.0
    relative_mpc.maximum_acceleration_mps2: 1.5
    relative_mpc.maximum_acceleration_increment_mps2: 0.25
    relative_mpc.maximum_speed_slack_mps: 2.0
    relative_mpc.maximum_iterations: 1000
    relative_mpc.absolute_tolerance: 0.0001
    relative_mpc.relative_tolerance: 0.0001
    relative_mpc.time_limit_s: 0.02
    relative_mpc.warm_start_enabled: true
    relative_mpc.active_constraint_tolerance: 0.001

    deck_attitude.filter_gain: 0.20
    deck_attitude.minimum_upward_normal_component: 0.50

    # deck-geometry shadow 仅发布 shadow 几何，禁止接入控制、状态机、窗口、触地或 hold。
    deck_plane_geometry.enabled: true
    # 独立 shadow 法向滤波；不得替代上方 production deck_attitude 或进入 landing window。
    deck_plane_geometry.normal_filter_gain: 0.08
    deck_plane_geometry.shadow_only: true
    deck_plane_geometry.minimum_normal_norm: 0.000001
    deck_plane_geometry.minimum_upward_component: 0.50
    # 来自 PX4 x500_base/model.sdf 两条滑橇碰撞盒最低中心线端点，FRD，单位 m。
    # 该近似忽略 7.5 mm 半宽支持面、柔性和接触求解压入。
    deck_plane_geometry.contact_points_body_frd_m: [
      -0.125, -0.132, 0.227,
       0.125, -0.132, 0.227,
      -0.125,  0.132, 0.227,
       0.125,  0.132, 0.227]
    # ID0/1/2/3 visual 平面高于甲板碰撞顶面的名义距离。
    deck_plane_geometry.marker_plane_offsets_m: [0.001, 0.002, 0.003, 0.004]
    deck_plane_geometry.apply_marker_plane_offset: true

    # terminal contact stabilization：默认关闭且仅 shadow。场景名只用于启动白名单，法向只能来自视觉估计。
    terminal_contact_stabilization.enabled: false
    terminal_contact_stabilization.shadow_only: true
    terminal_contact_stabilization.rehearsal_enabled: false
    terminal_contact_stabilization.scenario: none
    # 固定 +2° 目标；2.5° 为冻结命令上限，g*tan(2°)≈0.3425 m/s²。
    terminal_contact_stabilization.maximum_target_tilt_deg: 2.5
    terminal_contact_stabilization.normal_freshness_timeout_s: 0.20
    terminal_contact_stabilization.short_loss_hold_s: 0.10
    terminal_contact_stabilization.marker_switch_jump_gate_deg: 1.0
    terminal_contact_stabilization.tilt_slew_rate_degps: 4.0
    terminal_contact_stabilization.acceleration_bias_limit_mps2: 0.45
    terminal_contact_stabilization.acceleration_bias_slew_rate_mps3: 0.80
    terminal_contact_stabilization.activation_duration_s: 0.50
    terminal_contact_stabilization.deactivation_duration_s: 0.30
    # 不扩大 relative MPC 已冻结总水平 acceleration 上限。
    terminal_contact_stabilization.total_acceleration_limit_mps2: 1.50
    terminal_contact_stabilization.rehearsal_max_duration_s: 1.0
    # 确认触地后将相对高度参考缓慢压到 0.20 m，重新加载滑橇而非继续悬停卸载。
    terminal_contact_stabilization.preload_relative_height_m: 0.20
    # candidate/HOLD 中渐入向下加速度前馈，降低旋翼承重并提高滑橇法向载荷。
    terminal_contact_stabilization.preload_acceleration_mps2: 1.0
    terminal_contact_stabilization.preload_acceleration_slew_mps3: 1.0
    terminal_contact_stabilization.compliance.enabled: true
    terminal_contact_stabilization.compliance.horizontal_deadband_m: 0.015
    # 控制让步上限独立冻结为 0.04 m，不复用 evaluator 的 0.10 m 滑移门。
    terminal_contact_stabilization.compliance.maximum_allowance_m: 0.040
    terminal_contact_stabilization.compliance.maximum_target_rate_mps: 0.10
    terminal_contact_stabilization.compliance.maximum_anchor_correction_rate_mps: 0.05
    terminal_contact_stabilization.compliance.deck_velocity_deadband_mps: 0.035
    terminal_contact_stabilization.compliance.relative_velocity_damping_s: 0.12
    terminal_contact_stabilization.compliance.maximum_damping_offset_m: 0.020
    terminal_contact_stabilization.attitude_safety.enabled: true
    # 保护门低于 evaluator 10° 硬失败门；触发 recovery 的实验仍判 FAIL。
    terminal_contact_stabilization.attitude_safety.trigger_deg: 6.0
    terminal_contact_stabilization.attitude_safety.clear_deg: 4.0
    terminal_contact_stabilization.attitude_safety.angular_rate_trigger_degps: 45.0
    terminal_contact_stabilization.attitude_safety.required_duration_s: 0.20
    terminal_contact_stabilization.attitude_safety.clear_duration_s: 0.30

    landing_window.enter_horizontal_error_m: 0.15
    landing_window.exit_horizontal_error_m: 0.25
    landing_window.enter_relative_speed_mps: 0.15
    landing_window.exit_relative_speed_mps: 0.25
    landing_window.enter_max_tilt_deg: 5.0
    landing_window.exit_max_tilt_deg: 8.0
    landing_window.max_visual_age_s: 0.20
    landing_window.minimum_relative_height_m: 0.08
    landing_window.maximum_relative_height_m: 6.00
    landing_window.required_duration_s: 1.00

    descent.enabled: false
    descent.minimum_test_height_m: 0.50
    descent.fast_height_threshold_m: 2.00
    descent.slow_height_threshold_m: 0.80
    descent.fast_rate_mps: 0.50
    descent.medium_rate_mps: 0.30
    descent.slow_rate_mps: 0.12
    descent.recovery_height_m: 2.00
    descent.recovery_rate_mps: 0.30
    descent.max_reference_tracking_error_m: 0.50

    vehicle_pose_history.history_duration_s: 2.0
    vehicle_pose_history.max_endpoint_hold_s: 0.03
    vehicle_pose_history.clock_offset_filter_gain: 0.05
    vehicle_pose_history.max_clock_offset_jump_s: 0.10

    expected_aruco_pose_frame_id: camera_link
    # PX4 x500_mono_cam_down: base_link z=0.24 m, camera_link z=0.10 m，
    # 因此相机相对机体参考点位于 FRD Down 方向 0.14 m。
    camera_extrinsic.translation_frd_m: [0.0, 0.0, 0.14]
    camera_extrinsic.rotation_wxyz: [0.70710678, 0.0, 0.0, 0.70710678]

    offboard_prestream_count: 20
    stable_detect_count: 10

    camera_x_to_body_y_sign: 1.0
    camera_y_to_body_x_sign: -1.0
    max_xy_step: 0.20
    center_xy_threshold: 0.15

    max_descent_rate: 0.20
    final_alt: 0.30
    marker_lost_timeout: 1.0
    aruco_pose_timeout: 0.5

    takeoff_z_threshold: 0.20
    search_xy_threshold: 0.25
    search_z_threshold: 0.20
    command_retry_interval: 1.0

    enable_auto_land: false
    target_pose_frame_id: local_ned
